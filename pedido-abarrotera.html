<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido Abarrotera</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0e8; --card: #ffffff; --accent: #c0392b; --accent2: #e67e22;
    --dark: #1a1a1a; --mid: #5a5a5a; --light: #e8e2d6; --border: #d5cfc3;
    --green: #27ae60; --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--dark); min-height: 100vh; }

  /* LOADING */
  .loading-overlay {
    position: fixed; inset: 0; background: var(--dark);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 9999; gap: 16px;
  }
  .loading-logo { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: #fff; letter-spacing: 2px; }
  .loading-logo span { color: var(--accent2); }
  .spinner { width: 36px; height: 36px; border: 3px solid #333; border-top-color: var(--accent2); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* LOGIN */
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }
  #screen-login { align-items: center; justify-content: center; padding: 24px; background: radial-gradient(ellipse at 60% 20%, #2a1500 0%, #1a1a1a 60%); }
  .login-box { width: 100%; max-width: 360px; background: #222; border: 1px solid #333; border-radius: 20px; padding: 32px 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
  .login-logo { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 2px; color: var(--accent2); text-align: center; margin-bottom: 4px; }
  .login-sub { text-align: center; font-size: 11px; color: #777; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 28px; }
  .login-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #888; margin-bottom: 8px; display: block; }
  .login-input { width: 100%; background: #111; border: 1.5px solid #333; border-radius: 10px; padding: 13px 16px; font-family: 'DM Sans', sans-serif; font-size: 15px; color: #fff; outline: none; margin-bottom: 14px; letter-spacing: 2px; }
  .login-input:focus { border-color: var(--accent2); }
  .login-btn { width: 100%; padding: 13px; background: var(--accent2); color: #111; border: none; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; }
  .login-btn:active { opacity: 0.85; }
  .login-error { color: #e74c3c; font-size: 12px; text-align: center; margin-top: 10px; min-height: 18px; }

  /* APP */
  #screen-app { background: var(--bg); }
  header {
    background: var(--dark); color: #fff; padding: 14px 16px;
    display: flex; align-items: center; gap: 10px;
    position: sticky; top: 0; z-index: 100; box-shadow: 0 3px 16px rgba(0,0,0,0.3);
  }
  .header-left .logo { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; }
  .header-left .logo span { color: var(--accent2); }
  .header-left .user-name { font-size: 11px; color: var(--accent2); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 1px; }
  .header-spacer { flex: 1; }
  .sync-dot { font-size: 10px; color: #666; }
  .sync-dot.ok  { color: var(--green); }
  .sync-dot.err { color: var(--accent); }
  .logout-btn { background: transparent; border: 1px solid #333; border-radius: 7px; padding: 6px 12px; color: #888; font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700; cursor: pointer; }

  .tabs { display: flex; background: var(--dark); padding: 0 14px; border-top: 1px solid #2a2a2a; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 14px; border: none; background: transparent; color: #666; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; flex-shrink: 0; }
  .tab-btn.active { color: var(--accent2); border-bottom-color: var(--accent2); }
  .tab-add-btn { padding: 10px 12px; border: none; background: transparent; color: #555; font-size: 18px; cursor: pointer; flex-shrink: 0; }
  .tab-rename-bar { display: none; background: #222; padding: 8px 14px; align-items: center; gap: 8px; }
  .tab-rename-bar.open { display: flex; }
  .tab-rename-input { flex: 1; height: 34px; border: 1.5px solid #444; border-radius: 6px; background: #333; color: #fff; padding: 0 10px; font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; }
  .tab-rename-ok  { height: 34px; padding: 0 14px; border: none; border-radius: 6px; background: var(--accent2); color: #fff; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; }
  .tab-rename-del { height: 34px; padding: 0 12px; border: 1.5px solid #555; border-radius: 6px; background: transparent; color: #f88; font-size: 16px; cursor: pointer; }

  main { padding: 14px 14px 100px; max-width: 520px; margin: 0 auto; }
  .view { display: none; }
  .view.active { display: block; }

  /* ADMIN PANEL */
  .admin-section { background: var(--card); border: 1.5px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .admin-section-title { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 1px; color: var(--accent); margin-bottom: 12px; }
  .admin-emp-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--light); font-size: 13px; }
  .admin-emp-row:last-child { border-bottom: none; }
  .admin-emp-name { font-weight: 700; }
  .admin-emp-pass { color: var(--mid); font-size: 11px; }
  .admin-emp-estante { font-size: 11px; color: var(--accent2); font-weight: 700; }
  .admin-del-btn { background: transparent; border: 1px solid #ddd; border-radius: 6px; padding: 3px 8px; color: var(--accent); font-size: 11px; font-weight: 700; cursor: pointer; }
  .add-field { margin-bottom: 10px; }
  .add-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--mid); margin-bottom: 5px; display: block; }
  .add-input { width: 100%; height: 40px; border: 1.5px solid var(--border); border-radius: 8px; padding: 0 12px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--dark); background: var(--bg); outline: none; }
  .add-input:focus { border-color: var(--accent2); }
  .add-btn { width: 100%; height: 40px; border: none; border-radius: 8px; background: var(--dark); color: #fff; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 4px; }
  .add-btn:active { opacity: 0.85; }
  .msg-ok  { color: var(--green); font-size: 12px; margin-top: 6px; }
  .msg-err { color: var(--accent); font-size: 12px; margin-top: 6px; }

  /* PRODUCTOS */
  .prov-chip { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; padding: 2px 7px; border-radius: 20px; margin-top: 3px; cursor: pointer; }
  .reorder-btns { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
  .arrow-btn { width: 28px; height: 28px; border: 1.5px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--mid); font-size: 13px; display: flex; align-items: center; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .arrow-btn:active { background: var(--dark); color: #fff; border-color: var(--dark); }
  .arrow-btn:disabled { opacity: 0.2; cursor: default; }
  .producto-card { background: var(--card); border: 1.5px solid var(--border); border-radius: 10px; padding: 13px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); transition: border-color 0.2s, background 0.2s; }
  .producto-card.tiene-cantidad { border-color: var(--green); background: #f0faf4; }
  .producto-info { flex: 1; min-width: 0; }
  .producto-nombre { font-size: 13.5px; font-weight: 600; line-height: 1.3; color: var(--dark); }
  .edit-icon { font-size: 13px; color: #bbb; margin-left: 5px; cursor: pointer; }
  .qty-control { display: flex; align-items: center; border: 1.5px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--bg); flex-shrink: 0; }
  .qty-btn { width: 36px; height: 36px; border: none; background: transparent; font-size: 20px; font-weight: 700; color: var(--accent); cursor: pointer; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; }
  .qty-btn:active { background: #ffe0de; }
  .qty-input { width: 44px; height: 36px; border: none; background: transparent; text-align: center; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 700; color: var(--dark); outline: none; -moz-appearance: textfield; }
  .qty-input::-webkit-inner-spin-button, .qty-input::-webkit-outer-spin-button { -webkit-appearance: none; }

  .add-product-card { background: var(--card); border: 1.5px dashed var(--border); border-radius: 10px; padding: 14px; margin-bottom: 8px; }
  .add-product-toggle { width: 100%; border: none; background: transparent; padding: 0; display: flex; align-items: center; gap: 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700; color: var(--accent2); text-transform: uppercase; letter-spacing: 0.5px; }
  .plus-icon { width: 28px; height: 28px; border-radius: 50%; background: var(--accent2); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; transition: transform 0.2s; }
  .add-product-toggle.open .plus-icon { transform: rotate(45deg); }
  .add-product-form { display: none; margin-top: 14px; }
  .add-product-form.open { display: block; }
  .form-field { margin-bottom: 10px; }
  .form-label { font-size: 11px; font-weight: 700; color: var(--mid); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; display: block; }
  .form-input { width: 100%; height: 40px; border: 1.5px solid var(--border); border-radius: 8px; padding: 0 12px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--dark); background: var(--bg); outline: none; }
  .form-input:focus { border-color: var(--accent2); }
  .prov-inline-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .prov-inline-item { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; cursor: pointer; border: 2px solid transparent; -webkit-tap-highlight-color: transparent; }
  .prov-inline-item.selected { border-color: var(--dark); }
  .submit-btn { width: 100%; height: 42px; border: none; border-radius: 8px; background: var(--dark); color: #fff; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 4px; }

  /* RESUMEN */
  .resumen-card { background: var(--card); border: 1.5px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .resumen-card h3 { font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: 1px; color: var(--accent); margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1.5px solid var(--light); display: flex; align-items: center; gap: 8px; }
  .resumen-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13.5px; border-bottom: 1px solid var(--light); }
  .resumen-row:last-of-type { border-bottom: none; }
  .resumen-nombre { color: var(--dark); flex: 1; }
  .resumen-qty { font-weight: 700; color: var(--green); font-size: 14px; min-width: 40px; text-align: right; }
  .empty-msg { text-align: center; color: var(--mid); font-size: 14px; padding: 30px 0; opacity: 0.7; }

  /* PROVEEDORES */
  .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px; color: var(--mid); margin-bottom: 12px; }
  .prov-list-card { background: var(--card); border: 1.5px solid var(--border); border-radius: 10px; margin-bottom: 8px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); }
  .prov-color-dot { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; border: 2px solid rgba(0,0,0,0.08); }
  .prov-list-name { flex: 1; font-size: 14px; font-weight: 600; }
  .prov-list-count { font-size: 12px; color: var(--mid); }
  .add-prov-card { background: var(--card); border: 1.5px dashed var(--border); border-radius: 10px; padding: 16px; margin-top: 4px; }
  .add-prov-card .form-title { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 1px; color: var(--accent2); margin-bottom: 12px; }
  .form-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  .color-picker-wrap { position: relative; flex-shrink: 0; }
  .color-picker-btn { width: 40px; height: 40px; border-radius: 8px; border: 2px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  input[type="color"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: none; padding: 0; }
  .color-presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .color-preset { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: border-color 0.15s, transform 0.15s; }
  .color-preset.selected { border-color: var(--dark); transform: scale(1.15); }
  .prov-submit-btn { width: 100%; height: 42px; border: none; border-radius: 8px; background: var(--accent2); color: #fff; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; }

  /* WA / RESET */
  .wa-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px; background: #25d366; color: #fff; border: none; border-radius: 12px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 6px; box-shadow: 0 4px 16px rgba(37,211,102,0.3); }
  .wa-btn:active { opacity: 0.9; }
  .wa-btn-prov { background: #1ebe5d; margin-top: 8px; font-size: 13px; padding: 11px 14px; border-radius: 10px; }
  .reset-btn { display: block; width: 100%; padding: 12px; background: transparent; border: 1.5px solid #ccc; border-radius: 10px; color: var(--mid); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 10px; }

  /* MODAL EDITAR PRODUCTO */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 500; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--card); width: 100%; max-width: 520px; border-radius: 20px 20px 0 0; padding: 20px 20px 40px; animation: slideUp 0.25s ease; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px; color: var(--dark); margin-bottom: 16px; }
  .modal-label { font-size: 12px; font-weight: 600; color: var(--mid); margin-bottom: 6px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
  .modal-input { width: 100%; height: 44px; border: 1.5px solid var(--border); border-radius: 8px; padding: 0 12px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--dark); background: var(--bg); outline: none; margin-bottom: 12px; }
  .prov-select-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; max-height: 200px; overflow-y: auto; }
  .prov-select-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px; cursor: pointer; }
  .prov-select-item.selected { border-color: var(--green); background: #f0faf4; }
  .prov-select-dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; }
  .prov-select-name { font-size: 13px; font-weight: 600; }
  .modal-btns { display: flex; gap: 8px; }
  .modal-cancel { flex: 1; height: 44px; border: 1.5px solid var(--border); border-radius: 8px; background: transparent; color: var(--mid); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
  .modal-save { flex: 2; height: 44px; border: none; border-radius: 8px; background: var(--dark); color: #fff; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; }
  .modal-delete { width: 44px; height: 44px; border: 1.5px solid #f5c6cb; border-radius: 8px; background: #fff5f5; color: var(--accent); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  /* BOTTOM NAV */
  nav.bottom { position: fixed; bottom: 0; left: 0; right: 0; background: var(--dark); display: flex; border-top: 2px solid #333; z-index: 200; }
  .nav-btn { flex: 1; padding: 12px 6px; border: none; background: transparent; color: #888; font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: color 0.2s; }
  .nav-btn.active { color: var(--accent2); }
  .nav-btn svg { width: 20px; height: 20px; }
  .badge { background: var(--accent); color: #fff; border-radius: 10px; font-size: 10px; font-weight: 700; padding: 1px 6px; min-width: 18px; text-align: center; line-height: 16px; }

  .online-indicator { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-right: 4px; }
  .seccion-estante { font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 1px; color: var(--mid); padding: 8px 0 4px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
</style>
</head>
<body>

<div class="loading-overlay" id="loading-overlay">
  <div class="loading-logo">Pedido <span>Abarrotera</span></div>
  <div class="spinner"></div>
</div>

<!-- LOGIN -->
<div id="screen-login" class="screen">
  <div class="login-box">
    <div class="login-logo">Pedido <span>Abarrotera</span></div>
    <div class="login-sub">Abarrotes 3 Plebes</div>
    <label class="login-label">Contraseña</label>
    <input class="login-input" type="password" id="login-pass" placeholder="••••••" maxlength="20" onkeydown="if(event.key==='Enter') doLogin()">
    <button class="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div id="screen-app" class="screen">
  <header>
    <div class="header-left">
      <div class="logo">Pedido <span>Abarrotera</span></div>
      <div class="user-name" id="header-user">—</div>
    </div>
    <div class="header-spacer"></div>
    <span class="sync-dot" id="sync-dot">● Conectando</span>
    &nbsp;
    <button class="logout-btn" onclick="doLogout()">Salir</button>
  </header>

  <!-- TABS (solo empleados y admin en vista productos) -->
  <div class="tabs" id="tabs-estante" style="display:none"></div>
  <div class="tab-rename-bar" id="tab-rename-bar">
    <input class="tab-rename-input" id="tab-rename-input" type="text" maxlength="20" placeholder="Nombre del estante">
    <button class="tab-rename-del" onclick="eliminarEstante()">&#128465;</button>
    <button class="tab-rename-ok" onclick="guardarNombreEstante()">OK</button>
  </div>

  <main>
    <!-- VISTA PRODUCTOS (empleado y admin) -->
    <div id="view-productos" class="view active">
      <div id="productos-container"></div>
      <div class="add-product-card" id="add-product-card">
        <button class="add-product-toggle" id="add-toggle" onclick="toggleAddForm()">
          <span class="plus-icon">+</span> Agregar producto
        </button>
        <div class="add-product-form" id="add-form">
          <div class="form-field">
            <label class="form-label">Nombre</label>
            <input class="form-input" id="new-prod-nombre" type="text" placeholder="Nombre del producto" maxlength="60">
          </div>
          <div class="form-field">
            <label class="form-label">Proveedor</label>
            <div class="prov-inline-list" id="new-prod-prov-list"></div>
          </div>
          <button class="submit-btn" onclick="agregarProducto()">Agregar al Estante</button>
        </div>
      </div>
    </div>

    <!-- VISTA RESUMEN -->
    <div id="view-resumen" class="view">
      <div id="resumen-container"></div>
      <button class="reset-btn" onclick="confirmarReset()">&#128465; Limpiar mi pedido</button>
    </div>

    <!-- VISTA PROVEEDORES -->
    <div id="view-proveedores" class="view">
      <div class="section-title">Proveedores</div>
      <div id="prov-list-container"></div>
      <div class="add-prov-card">
        <div class="form-title">+ Nuevo Proveedor</div>
        <div class="form-row">
          <input class="form-input" id="new-prov-name" placeholder="Nombre" maxlength="20">
          <div class="color-picker-wrap">
            <div class="color-picker-btn" id="color-btn-display" style="background:#e67e22;">&#127752;
              <input type="color" id="new-prov-color" value="#e67e22" oninput="syncColor(this.value)">
            </div>
          </div>
        </div>
        <div class="color-presets" id="color-presets"></div>
        <button class="prov-submit-btn" onclick="agregarProveedor()">Guardar Proveedor</button>
      </div>
    </div>

    <!-- VISTA ADMIN -->
    <div id="view-admin" class="view">
      <!-- Usuarios online -->
      <div class="admin-section">
        <div class="admin-section-title">&#128101; Empleados activos</div>
        <div id="admin-online"></div>
      </div>

      <!-- Pedido en tiempo real -->
      <div class="admin-section">
        <div class="admin-section-title">&#128220; Pedido completo (tiempo real)</div>
        <div id="admin-pedido-global"></div>
      </div>

      <!-- Gestión de empleados -->
      <div class="admin-section">
        <div class="admin-section-title">&#128100; Gestionar empleados</div>

window.doLogin = async function() {
  const pass = document.getElementById('login-pass').value.trim();
  document.getElementById('login-error').textContent = '';
  if (!pass) return;

  if (pass === ADMIN_PASS) {
    sesion = { id: 'admin', nombre: 'Admin', estanteId: null, esAdmin: true };
    localStorage.setItem('pedido_sesion', JSON.stringify(sesion));
    iniciarApp();
    return;
  }

  try {
    const snap = await getDocs(collection(db, EMPLEADOS_COL));
    let found = null;
    snap.forEach(d => { if (d.data().pass === pass) found = { id: d.id, ...d.data() }; });
    if (found) {
      sesion = { id: found.id, nombre: found.nombre, estanteId: found.estanteId || null, esAdmin: false };
      localStorage.setItem('pedido_sesion', JSON.stringify(sesion));
      document.getElementById('login-pass').value = '';
      iniciarApp();
    } else {
      document.getElementById('login-error').textContent = 'Contraseña incorrecta.';
    }
  } catch(e) {
    document.getElementById('login-error').textContent = 'Error de conexión.';
  }
  document.getElementById('login-pass').value = '';
};

window.doLogout = function() {
  if (unsubConfig) { unsubConfig(); unsubConfig = null; }
  if (unsubCants)  { unsubCants();  unsubCants  = null; }
  sesion = null;
  localStorage.removeItem('pedido_sesion');
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-login').classList.add('active');
  document.getElementById('login-pass').value = '';
};

async function iniciarApp() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-app').classList.add('active');
  document.getElementById('header-user').textContent = sesion.esAdmin ? '👑 Admin' : sesion.nombre;

  // Cargar config (proveedores + estantes) con escucha en tiempo real
  unsubConfig = onSnapshot(CONFIG_REF, snap => {
    if (snap.exists()) {
      const d = snap.data();
      if (d.PROVEEDORES) PROVEEDORES = d.PROVEEDORES;
      if (d.ESTANTES)    ESTANTES    = d.ESTANTES;
    }
    setSync('ok');
    const lo = document.getElementById('loading-overlay');
    if (lo) lo.style.display = 'none';
    if (sesion.esAdmin) {
      configurarAdmin();
    } else {
      configurarEmpleado();
    }
  }, () => setSync('err'));

  // Escucha cantidades en tiempo real
  if (sesion.esAdmin) {
    // Admin ve todas las cantidades
    unsubCants = onSnapshot(collection(db, CANTIDADES_COL), snap => {
      todasCantidades = {};
      snap.forEach(d => { todasCantidades[d.id] = d.data().cantidades || {}; });
      if (vistaActiva === 'admin') renderAdminPedidoGlobal();
      if (vistaActiva === 'resumen') renderResumen();
    }, () => {});
  } else {
    // Empleado ve solo sus cantidades
    const empRef = doc(db, CANTIDADES_COL, sesion.id);
    unsubCants = onSnapshot(empRef, snap => {
      cantidades = snap.exists() ? (snap.data().cantidades || {}) : {};
      actualizarBadge();
      if (vistaActiva === 'productos') renderProductos();
      if (vistaActiva === 'resumen')   renderResumen();
    }, () => {});
  }
}

  });

  tabs.style.display = vista==='productos' ? 'flex' : 'none';

// ── TABS ─────────────────────────────────────────────────────────────
function renderTabs(conAgregar) {
  const container = document.getElementById('tabs-estante');
  let html = '';
  Object.keys(ESTANTES).forEach(ek => {
    html += '<button class="tab-btn'+(ek===estanteActivo?' active':'')+'" onclick="cambiarEstante(\''+ek+'\',this)" id="tab-'+ek+'">'+ESTANTES[ek].label+'</button>';
  });
  if (conAgregar) html += '<button class="tab-add-btn" onclick="agregarEstante()">+</button>';
  container.innerHTML = html;

  if (conAgregar) {
    Object.keys(ESTANTES).forEach(ek => {
      const btn = document.getElementById('tab-'+ek);
      if (!btn) return;
      let t;
      btn.addEventListener('touchstart', () => { t = setTimeout(() => abrirRenombrarEstante(ek), 600); });
      btn.addEventListener('touchend',   () => clearTimeout(t));
      btn.addEventListener('mousedown',  () => { t = setTimeout(() => abrirRenombrarEstante(ek), 600); });
      btn.addEventListener('mouseup',    () => clearTimeout(t));
    });
  }
}

  if (inp && inp !== document.activeElement) inp.value = n;
  actualizarBadge();
}
function actualizarBadge() {
  let total = 0;
  Object.keys(ESTANTES).forEach(ek => ESTANTES[ek].productos.forEach(p => { if (getCantidad(p.id)>0) total++; }));
  const b = document.getElementById('badge-resumen');
  if (b) { b.style.display = total>0?'inline-block':'none'; b.textContent = total; }
}
window.sumar = function(id) { cantidades[id]=(getCantidad(id)+1); actualizarCard(id,cantidades[id]); guardarCantidades(); };
window.restar = function(id) { cantidades[id]=Math.max(0,getCantidad(id)-1); actualizarCard(id,cantidades[id]); guardarCantidades(); };
window.setCantidad = function(id,val) { const n=Math.max(0,parseInt(val)||0); cantidades[id]=n; actualizarCard(id,n); guardarCantidades(); };
window.moverProducto = function(id,dir) {
  const prods = ESTANTES[estanteActivo].productos;
  const idx = prods.findIndex(p=>p.id===id);
  if (idx<0) return;
  const ni = idx+dir;
  if (ni<0||ni>=prods.length) return;
  [prods[idx],prods[ni]] = [prods[ni],prods[idx]];
  renderProductos(); guardarConfig();
};

// ── GUARDAR ───────────────────────────────────────────────────────────
async function guardarCantidades() {
  setSync('save');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await setDoc(doc(db, CANTIDADES_COL, sesion.id), {
        nombre: sesion.nombre,
        cantidades: cantidades,
        updatedAt: new Date().toISOString()
      });
      setSync('ok');
    } catch(e) { setSync('err'); }
  }, 600);
}

async function guardarConfig() {
  setSync('save');
  try {
    await setDoc(CONFIG_REF, { PROVEEDORES, ESTANTES, updatedAt: new Date().toISOString() });
    setSync('ok');
  } catch(e) { setSync('err'); }
}

// ── RENDER PRODUCTOS ─────────────────────────────────────────────────
function renderProductos() {
  const productos = ESTANTES[estanteActivo]?.productos || [];
  const container = document.getElementById('productos-container');
  if (!container) return;
  if (!productos.length) { container.innerHTML='<div class="empty-msg" style="margin-top:40px;">Estante sin productos.</div>'; return; }
  const total = productos.length;
  container.innerHTML = productos.map((p,idx) => {
    const qty = getCantidad(p.id);
    return '<div class="producto-card'+(qty>0?' tiene-cantidad':'')+'" id="card-'+p.id+'">' +
      '<div class="reorder-btns">' +
        '<button class="arrow-btn" onclick="moverProducto(\''+p.id+'\',-1)"'+(idx===0?' disabled':'')+'>&#9650;</button>' +
        '<button class="arrow-btn" onclick="moverProducto(\''+p.id+'\',1)"'+(idx===total-1?' disabled':'')+'>&#9660;</button>' +
      '</div>' +
      '<div class="producto-info">' +
        '<div class="producto-nombre">'+p.nombre+' <span class="edit-icon" onclick="abrirModal(\''+p.id+'\')">&#9998;</span></div>' +
        '<span class="prov-chip" style="'+chipStyle(p.proveedor)+'">'+p.proveedor+'</span>' +
      '</div>' +
      '<div class="qty-control">' +
        '<button class="qty-btn" onclick="restar(\''+p.id+'\')">&#8722;</button>' +
        '<input class="qty-input" id="qty-'+p.id+'" type="number" min="0" value="'+qty+'" onchange="setCantidad(\''+p.id+'\',this.value)" onclick="this.select()">' +
        '<button class="qty-btn" onclick="sumar(\''+p.id+'\')">+</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

// ── AGREGAR PRODUCTO ─────────────────────────────────────────────────
window.toggleAddForm = function() {
  addFormOpen = !addFormOpen;
  document.getElementById('add-toggle').classList.toggle('open', addFormOpen);
  document.getElementById('add-form').classList.toggle('open', addFormOpen);
  if (addFormOpen) renderProvInlineList();
};
function renderProvInlineList() {
  document.getElementById('new-prod-prov-list').innerHTML =
    Object.keys(PROVEEDORES).map(prov =>
      '<div class="prov-inline-item'+(prov===newProdProv?' selected':'')+'" style="'+chipStyle(prov)+'" onclick="seleccionarProvInline(this,\''+prov+'\')">'+prov+'</div>'
    ).join('');
}
window.seleccionarProvInline = function(el, prov) {
  newProdProv = prov;
  document.querySelectorAll('.prov-inline-item').forEach(i => i.classList.remove('selected'));
  el.classList.add('selected');
};
window.agregarProducto = function() {
  const nombre = document.getElementById('new-prod-nombre').value.trim().toUpperCase();
  if (!nombre) { alert('Escribe el nombre del producto.'); return; }
  if (!newProdProv) { alert('Selecciona un proveedor.'); return; }
  idCounter++;
  ESTANTES[estanteActivo].productos.push({ id:'custom_'+idCounter, nombre, proveedor:newProdProv });
  document.getElementById('new-prod-nombre').value = '';
  newProdProv = null;
  window.toggleAddForm();
  renderProductos();
  guardarConfig();
};

// ── MODAL EDITAR ─────────────────────────────────────────────────────
window.abrirModal = function(id) {
  editandoId = id;
  let p = null;
  Object.keys(ESTANTES).forEach(ek => ESTANTES[ek].productos.forEach(prod => { if (prod.id===id) p=prod; }));
  if (!p) return;
  document.getElementById('modal-nombre').value = p.nombre;
  document.getElementById('modal-prov-list').innerHTML = Object.keys(PROVEEDORES).map(prov => {
    const s = getProvStyle(prov);
    return '<div class="prov-select-item'+(prov===p.proveedor?' selected':'')+'" onclick="seleccionarProv(this)">' +
      '<div class="prov-select-dot" style="background:'+s.color+';"></div>' +
      '<span class="prov-select-name">'+prov+'</span></div>';
  }).join('');
  document.getElementById('modal-edit').classList.add('open');
  document.getElementById('modal-nombre').focus();
};
window.seleccionarProv = function(el) {
  document.querySelectorAll('.prov-select-item').forEach(i => i.classList.remove('selected'));
  el.classList.add('selected');
};
window.cerrarModal = function(e) { if (e.target===document.getElementById('modal-edit')) cerrarModalDirecto(); };
window.cerrarModalDirecto = function() { document.getElementById('modal-edit').classList.remove('open'); editandoId=null; };
window.guardarEdicion = function() {
  if (!editandoId) return;
  const nombre = document.getElementById('modal-nombre').value.trim();
  const sel = document.querySelector('.prov-select-item.selected');
  const prov = sel ? sel.querySelector('.prov-select-name').textContent : null;
  if (!nombre) { alert('El nombre no puede estar vacío.'); return; }
  if (!prov) { alert('Selecciona un proveedor.'); return; }
  Object.keys(ESTANTES).forEach(ek => ESTANTES[ek].productos.forEach(p => { if(p.id===editandoId){ p.nombre=nombre; p.proveedor=prov; } }));
  cerrarModalDirecto(); renderProductos(); guardarConfig();
};
window.eliminarProducto = function() {
  if (!editandoId) return;
  if (!confirm('Eliminar este producto?')) return;
  Object.keys(ESTANTES).forEach(ek => { ESTANTES[ek].productos = ESTANTES[ek].productos.filter(p=>p.id!==editandoId); });
  delete cantidades[editandoId];
  cerrarModalDirecto(); renderProductos(); actualizarBadge(); guardarConfig(); guardarCantidades();
};

// ── RESUMEN ──────────────────────────────────────────────────────────
function renderResumen() {
  const cont = document.getElementById('resumen-container');
  if (!cont) return;

  // Para empleado: sus propias cantidades. Para admin: todas agrupadas
  let grupos = []; // [{ label, provMap, provOrden }]

  if (sesion.esAdmin) {
    // Mostrar por empleado
    Object.keys(todasCantidades).forEach(empId => {
      const empCants = todasCantidades[empId];
      const provMap = {}, provOrden = [];
      Object.keys(ESTANTES).forEach(ek => {
        ESTANTES[ek].productos.forEach(p => {
          const qty = empCants[p.id] || 0;
          if (qty>0) {
            if (!provMap[p.proveedor]) { provMap[p.proveedor]=[]; provOrden.push(p.proveedor); }
            provMap[p.proveedor].push({ nombre:p.nombre, qty });
          }
        });
      });
      if (provOrden.length) grupos.push({ label: empId, provMap, provOrden });
    });
  } else {
    Object.keys(ESTANTES).forEach(ek => {
      const estante = ESTANTES[ek];
      const provMap = {}, provOrden = [];
      estante.productos.forEach(p => {
        const qty = getCantidad(p.id);
        if (qty>0) {
          if (!provMap[p.proveedor]) { provMap[p.proveedor]=[]; provOrden.push(p.proveedor); }
          provMap[p.proveedor].push({ nombre:p.nombre, qty });
        }
      });
      if (provOrden.length) grupos.push({ label: estante.label, provMap, provOrden });
    });
  }

  if (!grupos.length) { cont.innerHTML='<div class="empty-msg">Aún no hay productos en el pedido.</div>'; return; }

  cont.innerHTML = grupos.map(g =>
    g.provOrden.map(prov =>
      '<div class="resumen-card">' +
        '<h3><span class="prov-chip" style="'+chipStyle(prov)+'font-size:11px">'+prov+'</span> &middot; '+g.label+'</h3>' +
        g.provMap[prov].map(item =>
          '<div class="resumen-row"><span class="resumen-nombre">'+item.nombre+'</span><span class="resumen-qty">x '+item.qty+'</span></div>'
        ).join('') +
        '<button class="wa-btn wa-btn-prov" onclick="enviarWA(\''+prov+'\',\''+g.label+'\')">'+
          '<svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#fff;flex-shrink:0"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>' +
          'Enviar a '+prov+'</button>' +
      '</div>'
    ).join('')
  ).join('');
}

window.enviarWA = function(prov) {
  const hoyStr = dias[hoy.getDay()]+' '+hoy.getDate()+' '+meses[hoy.getMonth()]+' '+hoy.getFullYear();
  const lineas = ['*PEDIDO - Abarrotes 3 Plebes*','Fecha: '+hoyStr,'Proveedor: *'+prov.toUpperCase()+'*',''];
  // Combinar cantidades de todos los estantes, solo por proveedor
  const cants = sesion.esAdmin
    ? Object.values(todasCantidades).reduce((acc,c)=>{ Object.keys(c).forEach(k=>{ acc[k]=(acc[k]||0)+c[k]; }); return acc; }, {})
    : cantidades;
  Object.keys(ESTANTES).forEach(ek => {
    ESTANTES[ek].productos.forEach(p => {
      if (p.proveedor===prov && (cants[p.id]||0)>0) lineas.push(p.nombre+': '+cants[p.id]);
    });
  });
  if (lineas.length <= 4) { alert('No hay productos de '+prov+' en el pedido.'); return; }
  window.open('https://wa.me/?text='+encodeURIComponent(lineas.join('\n').trim()),'_blank');
};

window.confirmarReset = function() {
  if (!confirm('Limpiar tu pedido?')) return;
  cantidades = {};
  guardarCantidades(); renderProductos(); renderResumen(); actualizarBadge();
};

// ── PROVEEDORES ───────────────────────────────────────────────────────
function renderProveedores() {
  renderColorPresets();
  document.getElementById('prov-list-container').innerHTML = Object.keys(PROVEEDORES).map(prov => {
    const s = getProvStyle(prov);
    let count = 0;
    Object.keys(ESTANTES).forEach(ek => ESTANTES[ek].productos.forEach(p => { if(p.proveedor===prov) count++; }));
    return '<div class="prov-list-card">' +
      '<div class="prov-color-dot" style="background:'+s.color+';"></div>' +
      '<div><div class="prov-list-name">'+prov+'</div><div class="prov-list-count">'+count+' producto'+(count!==1?'s':'')+'</div></div>' +
    '</div>';
  }).join('');
}
function renderColorPresets() {
  document.getElementById('color-presets').innerHTML = COLOR_PRESETS.map(c =>
    '<div class="color-preset'+(c===selectedColor?' selected':'')+'" style="background:'+c+';" onclick="elegirPreset(\''+c+'\')"></div>'
  ).join('');
}
window.elegirPreset = function(c) { selectedColor=c; document.getElementById('new-prov-color').value=c; document.getElementById('color-btn-display').style.background=c; renderColorPresets(); };
window.syncColor = function(val) { selectedColor=val; document.getElementById('color-btn-display').style.background=val; renderColorPresets(); };
window.agregarProveedor = function() {
  const nombre = document.getElementById('new-prov-name').value.trim();
  if (!nombre) { alert('Escribe el nombre del proveedor.'); return; }
  if (PROVEEDORES[nombre]) { alert('Ya existe ese proveedor.'); return; }
  PROVEEDORES[nombre] = { bg:lighten(selectedColor,0.7), color:darken(selectedColor,0.3) };
  document.getElementById('new-prov-name').value = '';
  renderProveedores(); guardarConfig();
};

// ── ADMIN PANEL ───────────────────────────────────────────────────────
async function renderAdminEmpleados() {
  const snap = await getDocs(collection(db, EMPLEADOS_COL));
  const emps = [];
  snap.forEach(d => emps.push({ id:d.id, ...d.data() }));

  const lista = document.getElementById('admin-emp-lista');
  if (!lista) return;
  if (!emps.length) { lista.innerHTML='<div style="color:var(--mid);font-size:13px;padding:8px 0">No hay empleados.</div>'; return; }

  lista.innerHTML = emps.map(emp => {
    const estNombre = emp.estanteId && ESTANTES[emp.estanteId] ? ESTANTES[emp.estanteId].label : 'Sin asignar';
    return '<div class="admin-emp-row">' +
      '<div>' +
        '<div class="admin-emp-name">'+emp.nombre+'</div>' +
        '<div class="admin-emp-pass">🔑 '+emp.pass+' &nbsp;·&nbsp; <span class="admin-emp-estante">'+estNombre+'</span></div>' +
      '</div>' +
      '<button class="admin-del-btn" onclick="adminEliminarEmpleado(\''+emp.id+'\')">Eliminar</button>' +
    '</div>';
  }).join('');
}

function renderAdminPedidoGlobal() {
  const cont = document.getElementById('admin-pedido-global');
  if (!cont) return;

  // Sumar todas las cantidades de todos los empleados
  const total = {};
  Object.values(todasCantidades).forEach(c => {
    Object.keys(c).forEach(k => { total[k] = (total[k]||0) + c[k]; });
  });

  const provMap = {}, provOrden = [];
  Object.keys(ESTANTES).forEach(ek => {
    ESTANTES[ek].productos.forEach(p => {
      const qty = total[p.id] || 0;
      if (qty>0) {
        if (!provMap[p.proveedor]) { provMap[p.proveedor]=[]; provOrden.push(p.proveedor); }
        provMap[p.proveedor].push({ nombre:p.nombre, qty });
      }
    });
  });

  if (!provOrden.length) { cont.innerHTML='<div style="color:var(--mid);font-size:13px;padding:8px 0">No hay pedidos aún.</div>'; return; }

  cont.innerHTML = provOrden.map(prov =>
    '<div style="margin-bottom:12px">' +
      '<div style="font-size:11px;font-weight:700;text-transform:uppercase;margin-bottom:6px;"><span class="prov-chip" style="'+chipStyle(prov)+'">'+prov+'</span></div>' +
      provMap[prov].map(item =>
        '<div class="resumen-row"><span class="resumen-nombre">'+item.nombre+'</span><span class="resumen-qty">x '+item.qty+'</span></div>'
      ).join('') +
    '</div>'
  ).join('');
}

async function cargarEstantesSelector() {
  const sel = document.getElementById('admin-new-estante');
  if (!sel) return;
  sel.innerHTML = '<option value="">— Sin asignar —</option>' +
    Object.keys(ESTANTES).map(ek => '<option value="'+ek+'">'+ESTANTES[ek].label+'</option>').join('');
}

window.adminAgregarEmpleado = async function() {
  const nombre    = document.getElementById('admin-new-nombre').value.trim();
  const pass      = document.getElementById('admin-new-pass').value.trim();
  const estanteId = document.getElementById('admin-new-estante').value;
  const msg       = document.getElementById('admin-emp-msg');
  msg.textContent = ''; msg.className = '';

  if (!nombre||!pass) { msg.textContent='Completa nombre y contraseña.'; msg.className='msg-err'; return; }
  if (pass===ADMIN_PASS) { msg.textContent='Esa contraseña está reservada.'; msg.className='msg-err'; return; }

  const snap = await getDocs(collection(db, EMPLEADOS_COL));
  let dup = false;
  snap.forEach(d => { if (d.data().pass===pass) dup=true; });
  if (dup) { msg.textContent='Esa contraseña ya está en uso.'; msg.className='msg-err'; return; }

  try {
    await addDoc(collection(db, EMPLEADOS_COL), { nombre, pass, estanteId: estanteId||'', creadoEn: Date.now() });
    document.getElementById('admin-new-nombre').value = '';
    document.getElementById('admin-new-pass').value   = '';
    document.getElementById('admin-new-estante').value = '';
    msg.textContent = '✅ Empleado agregado.'; msg.className='msg-ok';
    setTimeout(()=>{ msg.textContent=''; }, 2500);
    renderAdminEmpleados();
  } catch(e) {
    msg.textContent='Error al guardar.'; msg.className='msg-err';
  }
};

window.adminEliminarEmpleado = async function(id) {
  if (!confirm('¿Eliminar este empleado?')) return;
  try {
    await deleteDoc(doc(db, EMPLEADOS_COL, id));
    renderAdminEmpleados();
  } catch(e) { alert('Error al eliminar.'); }
};

// ── INICIO ────────────────────────────────────────────────────────────
async function arrancar() {
  // Limpiar sesion vieja del sistema anterior si existe
  const savedOld = localStorage.getItem('checador_data');
  // Solo limpiar si la sesion guardada no tiene la estructura correcta
  const saved = localStorage.getItem('pedido_sesion');
  if (saved) {
    try {
      const s = JSON.parse(saved);
      // Validar que la sesión tenga la estructura correcta
      if (!s || typeof s !== 'object' || !s.id) throw new Error('Sesión inválida');
      if (s.esAdmin && s.id === 'admin') {
        sesion = s;
        iniciarApp();
        return;
      } else if (!s.esAdmin && s.id) {
        const empDoc = await getDoc(doc(db, EMPLEADOS_COL, s.id));
        if (empDoc.exists()) {
          sesion = { id:s.id, nombre:empDoc.data().nombre, estanteId:empDoc.data().estanteId||null, esAdmin:false };
          iniciarApp();
          return;
        }
      }
    } catch(e) {
      console.log('Sesión inválida, mostrando login');
    }
    localStorage.removeItem('pedido_sesion');
  }
  document.getElementById('loading-overlay').style.display = 'none';
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-login').classList.add('active');
}

arrancar().catch(e => {
  console.error('Error arrancar:', e);
  document.getElementById('loading-overlay').style.display = 'none';
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-login').classList.add('active');
});
</script>
